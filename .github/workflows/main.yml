name: 部署羽球實驗室到 GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝依賴並編譯
        run: |
          npm install
          npm run build

      - name: 上傳部署檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      - name: 執行部署
        id: deployment
        uses: actions/deploy-pages@v4
